<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartFinTrack</title>
<link rel="icon" type="image/svg+xml" href="pwa/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="pwa/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="pwa/favicon-16.png">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=63">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="shell" id="shell">
    <div class="content">
    <header class="topbar menubar">
      <div class="brand"><span class="mark"></span><span class="lbl">Smart<em>Fin</em>Track</span></div>
      <nav id="tabs">
      <button data-view="overview" class="active"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg></i><span>Dashboard</span></button>
      <button data-view="transactions"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></i><span>Ledger</span></button>
      <button data-view="budgets"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></i><span>Budgets</span></button>
      <button data-view="investments"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></i><span>Investments</span></button>
      <button data-view="networth"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg></i><span>Net worth</span></button>
      <button data-view="goals"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></i><span>Goals</span></button>
      <button data-view="subs"><i><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></i><span>Subscriptions</span></button>
    </nav>
      <input id="q" class="search" type="search" placeholder="Search transactions…" autocomplete="off">
      <div class="topright">
        <button id="wallBtn" class="iconbtn" title="Change background" aria-label="Change background">🖼</button>
        <button id="themeBtn" class="iconbtn" aria-label="Toggle light or dark theme"></button>
        <button id="bell" class="iconbtn" title="Budget alerts" aria-label="Budget alerts">🔔<span id="bellDot" class="dotbadge" hidden></span></button>
        <span id="railNote" class="railnote"></span>
        <span id="modeBadge" class="badge" hidden></span>
        <span id="userName" class="chip"></span>
        <button id="authBtn" class="ghost" hidden></button>
      </div>
    </header>
    <div id="wallPop" class="wallpop" hidden></div>
    <main id="app"><p class="muted">Loading…</p></main>
  </div>
</div>
<script src="js/firebase-config.js?v=63"></script>
  <script src="js/icon-index.js?v=63"></script>
<script src="js/app.js?v=63"></script>
<script src="js/import.js?v=63"></script>
<script src="js/sms.js?v=63"></script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));</script>
</body>
</html>
